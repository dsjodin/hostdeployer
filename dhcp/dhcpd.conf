# ISC dhcpd configuration for ESXi auto-deployment (legacy).
#
# ISC dhcpd reached end of life in 2022 and has no management API, so this
# file is kept only for existing installs. New deployments should use
# dhcp/kea-dhcp4.conf instead -- see docs/dhcp-kea.md.
#
# Addresses below are RFC 5737 documentation addresses. update_dhcp_config.sh
# regenerates this file from the values stored in global_config.json.
#
# HTTP only: there is deliberately no TFTP / undionly.kpxe / pxelinux path.
# Every client here is a UEFI machine that can boot over HTTP.

option domain-name "local";
option domain-name-servers 192.0.2.53;
default-lease-time 600;
max-lease-time 7200;
authoritative;
log-facility local7;

# RFC 4578 client architecture and the vendor class used for UEFI HTTP boot.
option arch code 93 = unsigned integer 16;

subnet 192.0.2.0 netmask 255.255.255.0 {
  range 192.0.2.100 192.0.2.200;
  option routers 192.0.2.1;

  # The deployment server. iPXE exposes this as ${next-server}, which
  # ipxe/boot.ipxe uses to build its URLs.
  next-server 192.0.2.10;

  if exists user-class and option user-class = "iPXE" {
    # Already running iPXE: hand over the chain script.
    filename "http://192.0.2.10/ipxe/boot.ipxe";

  } elsif substring(option vendor-class-identifier, 0, 10) = "HTTPClient" {
    # UEFI HTTP Boot. The firmware requires this exact vendor class in the
    # reply, otherwise it ignores the response.
    option vendor-class-identifier "HTTPClient";
    filename "http://192.0.2.10/ipxe/ipxe.efi";

  } elsif option arch = 00:07 or option arch = 00:09 or option arch = 00:0b {
    # UEFI PXE (x64 / EFI BC / arm64). These fetch the loader over TFTP, so
    # this branch is the only one that still needs a tftpd. Enable HTTP Boot
    # in firmware where the hardware supports it and this branch goes away.
    filename "ipxe.efi";

  } else {
    # Legacy BIOS clients are not supported by this deployment system.
    # No filename is offered, so they fall through to the next boot device.
  }
}
