// Kea DHCPv4 configuration for ESXi auto-deployment.
//
// This is the recommended replacement for ISC dhcpd. Kea gives us three
// things the old server could not:
//
//   1. A control API (the "control-socket" below, optionally exposed over
//      HTTP by kea-ctrl-agent). Subnets, pools and reservations can be
//      changed at runtime with config-set / subnet4-*, so the admin UI no
//      longer needs to regenerate a text file, run a syntax check and
//      systemctl restart the daemon.
//   2. Host reservations as first-class data, so a per-server boot file can
//      be pinned by MAC without rewriting the global config.
//   3. Structured JSON config that the same tooling can read back.
//
// Addresses below are RFC 5737 documentation addresses; update_dhcp_config.sh
// regenerates this file from the values stored in global_config.json.
// Adjust the interface, subnet, pool and server IP for your environment.
// Validate with:  kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
{
"Dhcp4": {
    "interfaces-config": {
        // Bind explicitly; do not listen on every interface.
        "interfaces": [ "eth0" ]
    },

    "control-socket": {
        // Used by kea-ctrl-agent and by `kea-shell`. This is the entry point
        // for API-driven changes from the admin UI.
        "socket-type": "unix",
        "socket-name": "/run/kea/kea4-ctrl-socket"
    },

    "lease-database": {
        "type": "memfile",
        "lfc-interval": 3600,
        "name": "/var/lib/kea/kea-leases4.csv"
    },

    "valid-lifetime": 600,
    "max-valid-lifetime": 7200,

    "loggers": [
        {
            "name": "kea-dhcp4",
            "output_options": [ { "output": "/var/log/kea/kea-dhcp4.log" } ],
            "severity": "INFO"
        }
    ],

    // -------------------------------------------------------------------
    // Client classification
    //
    // The order matters: iPXE must be matched before the generic UEFI
    // classes, otherwise a machine that has already chainloaded iPXE is sent
    // the loader again and loops forever.
    // -------------------------------------------------------------------
    "client-classes": [
        {
            // Set by iPXE itself once it is running (option 77, user-class).
            "name": "iPXE",
            "test": "substring(option[77].hex, 0, 4) == 'iPXE'",
            "boot-file-name": "http://192.0.2.10/ipxe/boot.ipxe"
        },
        {
            // UEFI HTTP Boot (RFC 3925 / option 60 "HTTPClient"). The reply
            // must echo the HTTPClient vendor class or the firmware ignores
            // it. This is the preferred path: no TFTP anywhere.
            "name": "UEFI-HTTP",
            "test": "not member('iPXE') and substring(option[60].hex, 0, 10) == 'HTTPClient'",
            "option-data": [
                {
                    "name": "vendor-class-identifier",
                    "data": "HTTPClient"
                }
            ],
            "boot-file-name": "http://192.0.2.10/ipxe/ipxe.efi"
        },
        {
            // UEFI PXE (arch 7 = x64, 9 = EFI BC, 11 = arm64). This branch
            // still uses TFTP because the firmware PXE stack has no HTTP
            // client; it exists only for hardware that cannot HTTP Boot.
            "name": "UEFI-PXE",
            "test": "not member('iPXE') and (option[93].hex == 0x0007 or option[93].hex == 0x0009 or option[93].hex == 0x000b)",
            "next-server": "192.0.2.10",
            "boot-file-name": "ipxe.efi"
        }
        // Legacy BIOS (arch 0) is intentionally absent: ESXi 8 requires UEFI,
        // so there is no undionly.kpxe / pxelinux path to maintain.
    ],

    "subnet4": [
        {
            "id": 1,
            "subnet": "192.0.2.0/24",
            "pools": [ { "pool": "192.0.2.100 - 192.0.2.200" } ],

            // Advertised as siaddr; ipxe/boot.ipxe reads it as ${next-server}.
            "next-server": "192.0.2.10",

            "option-data": [
                { "name": "routers",             "data": "192.0.2.1" },
                { "name": "domain-name-servers", "data": "192.0.2.53" },
                { "name": "domain-name",         "data": "local" },
                { "name": "ntp-servers",         "data": "192.0.2.53" }
            ],

            // Per-host overrides. Managed through the API in production;
            // this literal entry is only an example of the shape.
            "reservations": [
                // {
                //     "hw-address": "88:e9:a4:d6:59:2a",
                //     "ip-address": "192.0.2.51",
                //     "hostname": "esxi01"
                // }
            ]
        }
    ]
}
}
