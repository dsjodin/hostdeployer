# Lint configuration for the helper scripts.
#
# The selection is deliberately narrow: errors that mean the code is wrong,
# not opinions about how it is written.
#
#   E4/E7/E9  import, statement and syntax errors
#   F         pyflakes -- undefined names, unused imports and variables
#
# What is left out, and why:
#
#   W    trailing whitespace and blank-line style. Real, and forty-odd
#        instances of it across scripts nobody is otherwise touching. Churn
#        in a diff is not worth the review attention it costs.
#   BLE  blind "except Exception". The scanner talks to BMCs over the network
#        and must keep going when one of them answers with something
#        unexpected; catching narrowly there would mean enumerating every way
#        an iLO can misbehave, which is not knowable in advance. The bare
#        "except:" that swallowed KeyboardInterrupt has been fixed -- that one
#        was a bug rather than a style.
#   EXE  shebang without the executable bit. These are run as "python3 x.py"
#        from PHP, so the bit would be decoration.
#
# Widening this later is cheap. Starting wide would have meant either a large
# unrelated diff or a wall of ignores, and both hide the findings that matter.
target-version = "py39"

line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]
