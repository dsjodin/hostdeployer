# Standard ESXi kickstart template.
#
# Rendered by www/generate_kickstart.php. Every {{TOKEN}} is substituted with
# per-host data; conditional blocks are dropped when their variable is unset.
# Do not hardcode addresses here.

# Accept the VMware End User License Agreement
vmaccepteula

# Set the root password
rootpw --iscrypted {{ROOT_PASSWORD_HASH}}

# Install on the first local disk
install --firstdisk --overwritevmfs

# Set the network
network --bootproto=static --ip={{ESXMGMT_IP}} --netmask={{ESXMGMT_NETMASK}} --gateway={{ESXMGMT_GATEWAY}} --vlanid={{ESXIMGMT_VLANID}} --nameserver={{DNS_SERVERS}} --hostname={{HOSTNAME}}

# Reboot after installation
reboot

%firstboot --interpreter=busybox

# Set the fully qualified hostname before generating certificates
esxcli system hostname set --fqdn={{FQDN}}

# Ensure the TLS certificate matches the ESXi FQDN
/sbin/generate-certificates

# NTP
esxcli system ntp set -s {{NTP_SERVERS}}
esxcli system ntp set -e 1

{{IF VMOTION_CONFIGURED}}
# vMotion VMkernel port.
# The addresses come from the host record, not from this template: the
# previous version hardcoded a single IP, so every host provisioned from it
# ended up with a duplicate vMotion address.
esxcli network vswitch standard portgroup add --portgroup-name=vMotion --vswitch-name=vSwitch0
esxcli network vswitch standard portgroup set --portgroup-name=vMotion --vlan-id={{VMOTION_VLANID}}
esxcli network ip netstack add --netstack=vmotion
esxcli network ip interface add --interface-name=vmk1 --portgroup-name=vMotion --netstack=vmotion --mtu=9000
esxcli network ip interface ipv4 set --interface-name=vmk1 --ipv4={{VMOTION_IP}} --netmask={{VMOTION_NETMASK}} --type=static
{{ENDIF}}

# Report completion back to the deployment server
/bin/curl -s "{{SERVER_URL}}/admin/deployment_complete.php?mac={{MAC_ADDRESS}}" > /tmp/deployment_complete.log 2>&1
