# Kickstart template for VCF
# This will be dynamically filled by the deployment server

# Accept the VMware End User License Agreement
vmaccepteula

# Set the root password
rootpw --iscrypted {{ROOT_PASSWORD_HASH}}

# Install on the first local disk
install --firstdisk --overwritevmfs

# Set the network
network --bootproto=static --ip={{ESXMGMT_IP}} --netmask={{ESXMGMT_NETMASK}} --gateway={{ESXMGMT_GATEWAY}} --vlanid={{ESXIMGMT_VLANID}} --nameserver={{DNS_SERVERS}} --hostname={{HOSTNAME}}

# Reboot after installation
reboot

%firstboot --interpreter=busybox

# Set hostname
esxcli system hostname set --fqdn={{FQDN}}

 Extract domain from FQDN and set it as the DNS search domain
DOMAIN=$(echo "{{FQDN}}" | cut -d '.' -f 2-)
if [ -n "$DOMAIN" ]; then
  echo "Setting DNS search domain to: $DOMAIN"
  esxcli network ip dns search add --domain=$DOMAIN
else
  echo "Warning: Could not extract domain from FQDN, using default domain instead"
  esxcli network ip dns search add --domain=generalfailure.io
fi

# Ensure TLS certificate matches ESXi FQDN
/bin/generate-certificates

# Restart services to apply the new certificates
/etc/init.d/hostd restart
/etc/init.d/vpxa restart
/etc/init.d/rhttpproxy restart

# Wait for services to come back up
echo "Waiting for hostd service to become available..."
sleep 20

# Ensure hostd is ready before continuing
while ! vim-cmd hostsvc/runtimeinfo; do
  echo "Waiting for hostd service..."
  sleep 10
done

# NTP
esxcli system ntp set -s {{NTP_SERVERS}}
esxcli system ntp set -e 1

# Download and run Python script for deployment completion notification
echo "Downloading deployment notification script..."
wget -q -O /tmp/notify_deployment.py http://{{SERVER_IP}}/admin/notify_deployment.py

# Make the script executable
chmod +x /tmp/notify_deployment.py

# Run the script with the MAC address parameter
echo "Running notification script..."
python /tmp/notify_deployment.py --mac={{MAC_ADDRESS}} --server={{SERVER_IP}}

# Set final message to confirm completion
echo "ESXi deployment completed successfully."