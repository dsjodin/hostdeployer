# VMware Cloud Foundation (VCF) ESXi kickstart template.
#
# Rendered by www/generate_kickstart.php. Do not hardcode addresses here.
# VCF takes ownership of vMotion and the remaining networking, so this
# template only brings up management.

# Accept the VMware End User License Agreement
vmaccepteula

# Set the root password
rootpw --iscrypted {{ROOT_PASSWORD_HASH}}

# Install on the first local disk
install --firstdisk --overwritevmfs

# Set the network
network --bootproto=static --ip={{ESXMGMT_IP}} --netmask={{ESXMGMT_NETMASK}} --gateway={{ESXMGMT_GATEWAY}} --vlanid={{ESXIMGMT_VLANID}} --nameserver={{DNS_SERVERS}} --hostname={{HOSTNAME}}

# Reboot after installation
reboot

%firstboot --interpreter=busybox

# Tell the deployment server we reached first boot. Without this the dashboard
# sees nothing between the installer finishing and the callback at the end,
# which on a slow host is several minutes of looking wedged. Failures are
# ignored: a host that installed correctly must not be reported as broken
# because a progress beacon did not get through.
/bin/curl -s "{{SERVER_URL}}/progress.php?mac={{MAC_ADDRESS}}&t={{BOOT_TOKEN}}&step=firstboot" >/dev/null 2>&1 || true

# Set hostname
esxcli system hostname set --fqdn={{FQDN}}

# Derive the DNS search domain from the FQDN.
# Note the leading '#': this comment was missing its marker, so busybox tried
# to execute the sentence and logged an error on every deployment.
DOMAIN=$(echo "{{FQDN}}" | cut -d '.' -f 2-)
if [ -n "$DOMAIN" ]; then
  echo "Setting DNS search domain to: $DOMAIN"
  esxcli network ip dns search add --domain=$DOMAIN
else
  echo "Warning: could not extract a domain from the FQDN; skipping DNS search domain"
fi

# Ensure the TLS certificate matches the ESXi FQDN.
# The binary lives in /sbin, not /bin.
/sbin/generate-certificates

# Restart services to pick up the new certificates
/etc/init.d/hostd restart
/etc/init.d/vpxa restart
/etc/init.d/rhttpproxy restart

# Wait for hostd to come back before continuing, but do not wait forever.
echo "Waiting for the hostd service to become available..."
attempts=0
while ! vim-cmd hostsvc/runtimeinfo > /dev/null 2>&1; do
  attempts=$((attempts + 1))
  if [ "$attempts" -ge 30 ]; then
    echo "Warning: hostd did not become available after 5 minutes; continuing anyway"
    break
  fi
  echo "Waiting for hostd service (attempt $attempts)..."
  sleep 10
done

# NTP
esxcli system ntp set -s {{NTP_SERVERS}}
esxcli system ntp set -e 1

# Report completion back to the deployment server.
# curl is present on ESXi 7 and 8; the previous wget+python approach depended
# on a Python interpreter that ESXi 8 no longer ships by default.
/bin/curl -s "{{SERVER_URL}}/admin/deployment_complete.php?mac={{MAC_ADDRESS}}&t={{BOOT_TOKEN}}" > /tmp/deployment_complete.log 2>&1

echo "ESXi deployment completed successfully."
