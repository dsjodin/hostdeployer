# Shown to hosts that have registered but are not yet approved.
#
# There is deliberately no "install" directive: the installer stops at the
# %pre stage, prints the message and shuts down, so the server can be powered
# on again once an operator approves it.

vmaccepteula

%include /tmp/shutdown.cfg

%pre --interpreter=busybox
echo 'shutdown' > /tmp/shutdown.cfg
echo '=================================================='
echo ' This server is registered but NOT yet approved'
echo ' MAC:        {{MAC_ADDRESS}}'
echo ' Registered: {{REGISTERED_TIME}}'
echo ' Approve it in the deployment dashboard, then'
echo ' power the server on again.'
echo '=================================================='
sleep 120
