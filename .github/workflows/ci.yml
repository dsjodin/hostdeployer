name: ci

on:
  # Only the default branch on push. Everything else arrives as a pull
  # request, and running both events doubles every check on a PR branch.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The application targets PHP 8.1. Linting on the lowest supported version
  # is the point of this job: syntax that only parses on 8.4 would otherwise
  # reach a server running the version the README asks for.
  php-syntax:
    name: php-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: sodium, pdo_sqlite
          coverage: none

      - name: syntax
        run: |
          find lib www scripts tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  # The test tooling is a development dependency and does not have to run on
  # the version the appliance runs on: PHPUnit 11 requires PHP 8.2, and
  # holding the whole suite back to 8.1 to match would be the tail wagging the
  # dog. What the application supports is checked by php-syntax above.
  php-test:
    name: php-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: phpunit
        run: vendor/bin/phpunit

      # Level 5 is what catches the failure mode this repository actually had:
      # three functions were called from the admin UI and defined nowhere, so
      # the entire Hardware Scan tab was a white page. See docs/CODE-REVIEW.md.
      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # update_dhcp_config.sh runs as root through a sudo rule and writes the
      # DHCP server's configuration, so it is the last script in the tree that
      # should carry a quoting bug.
      - name: shellcheck
        run: shellcheck update_dhcp_config.sh

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: compile
        run: python -m compileall -q scripts

      - name: ruff
        run: |
          pipx install ruff
          ruff check scripts

  templates:
    name: templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A kickstart that reaches a host with an unsubstituted {{TOKEN}} in it
      # is a failed install, and the renderer silently leaves unknown tokens
      # alone. Check that every token a template uses is one the generator
      # actually supplies.
      - name: every template token is supplied by the generator
        run: |
          status=0
          for tpl in templates/*.cfg; do
            # Comment lines are excluded: the templates document their own
            # {{TOKEN}} syntax in a header, and that is not a variable.
            # ENDIF and ELSE are control directives handled by
            # processConditionals(), not values the generator supplies.
            tokens=$(grep -v '^[[:space:]]*#' "$tpl" \
              | grep -o '{{[A-Z0-9_]*}}' \
              | tr -d '{}' \
              | grep -Ev '^(ENDIF|ELSE)$' \
              | sort -u)

            for token in $tokens; do
              grep -q "'$token'" www/generate_kickstart.php \
                || { echo "::error file=$tpl::{{$token}} is not set by generate_kickstart.php"; status=1; }
            done
          done
          exit $status
