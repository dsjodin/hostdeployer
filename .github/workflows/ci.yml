name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: sodium, pdo_sqlite
          coverage: none

      # The application targets PHP 8.1 and up. Linting on the lowest
      # supported version is the point: syntax that only parses on 8.4 would
      # otherwise reach a server running the version the README asks for.
      - name: syntax
        run: |
          find lib www scripts tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - uses: ramsey/composer-install@v3

      - name: phpunit
        run: vendor/bin/phpunit

      # Level 5 is what catches the failure mode this repository actually had:
      # three functions were called from the admin UI and defined nowhere, so
      # the entire Hardware Scan tab was a white page. See docs/CODE-REVIEW.md.
      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # update_dhcp_config.sh runs as root through a sudo rule and writes the
      # DHCP server's configuration, so it is the last script in the tree that
      # should carry a quoting bug.
      - name: shellcheck
        run: shellcheck update_dhcp_config.sh

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: compile
        run: python -m compileall -q scripts

      - name: ruff
        run: |
          pipx install ruff
          ruff check scripts

  templates:
    name: templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A kickstart that reaches a host with an unsubstituted {{TOKEN}} in it
      # is a failed install, and the renderer silently leaves unknown tokens
      # alone. Check that every token a template uses is one the generator
      # actually supplies.
      - name: every template token is supplied by the generator
        run: |
          status=0
          for tpl in templates/*.cfg; do
            for token in $(grep -o '{{[A-Z0-9_]*}}' "$tpl" | tr -d '{}' | sort -u); do
              grep -q "'$token'" www/generate_kickstart.php \
                || { echo "::error file=$tpl::{{$token}} is not set by generate_kickstart.php"; status=1; }
            done
          done
          exit $status
