name: ci

on:
  # Only the default branch on push. Everything else arrives as a pull
  # request, and running both events doubles every check on a PR branch.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The application targets PHP 8.1. Linting on the lowest supported version
  # is the point of this job: syntax that only parses on 8.4 would otherwise
  # reach a server running the version the README asks for.
  php-syntax:
    name: php-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: sodium, pdo_sqlite
          coverage: none

      - name: syntax
        run: |
          find lib www scripts tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  # The test tooling is a development dependency and does not have to run on
  # the version the appliance runs on: PHPUnit 11 requires PHP 8.2, and
  # holding the whole suite back to 8.1 to match would be the tail wagging the
  # dog. What the application supports is checked by php-syntax above.
  php-test:
    name: php-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: phpunit
        run: vendor/bin/phpunit

      # Level 5 is what catches the failure mode this repository actually had:
      # three functions were called from the admin UI and defined nowhere, so
      # the entire Hardware Scan tab was a white page. See docs/CODE-REVIEW.md.
      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh runs as root and deploy/kea-config.sh writes the DHCP
      # server's configuration, so these are the last scripts in the tree that
      # should carry a quoting bug.
      - name: shellcheck
        run: shellcheck install.sh deploy/*.sh

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: compile
        run: python -m compileall -q scripts

      - name: ruff
        run: |
          pipx install ruff
          ruff check scripts

  templates:
    name: templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      # A kickstart that reaches a host with an unsubstituted {{TOKEN}} in it
      # is a failed install, and the renderer silently leaves unknown tokens
      # alone.
      #
      # This used to be grep against generate_kickstart.php, which was an
      # approximation of a check the application can do exactly -- and one the
      # templates an operator edits and uploads through the admin UI never went
      # through, since they do not pass CI. templateUnknownTokens() is now the
      # single implementation; the UI warns with it on every save, and this
      # runs the same function over the templates in the repository.
      - name: every template token is supplied by the generator
        run: |
          php -r '
            require "lib/templates.php";
            $status = 0;
            foreach (glob("templates/*.cfg") as $tpl) {
              foreach (templateUnknownTokens((string)file_get_contents($tpl)) as $token) {
                fwrite(STDERR, "::error file=$tpl::{{" . $token . "}} is not supplied by the generator\n");
                $status = 1;
              }
            }
            exit($status);
          '
