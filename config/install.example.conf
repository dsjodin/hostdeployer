# hostdeployer install settings.
#
#   cp config/install.example.conf install.conf
#   chmod 600 install.conf
#   sudo ./install.sh --config install.conf
#
# KEY=value, one per line. Blank lines and # comments are ignored, values may
# be quoted, and anything given on the command line wins over this file.
#
# This file is read line by line into a fixed list of names, never sourced, so
# nothing in it can run a command. Values are still validated afterwards.

# ---------------------------------------------------------------------------
# The three networks
# ---------------------------------------------------------------------------
#
# This appliance sits on three, and keeping them apart is the point:
#
#   admin    operators reach the dashboard here, and only here. It holds the
#            iLO administrator account and the ESXi root password for every
#            host this thing installs.
#   BMC      the iLO/iDRAC network. Outbound only -- nothing listens on it.
#            The scanner sweeps it, so the deployer needs a route to it.
#   deploy   where servers PXE/HTTP boot. DHCP, the boot chain and the ESXi
#            media live here. A machine on this network is mid-install and is
#            running code nobody has reviewed, which is why the dashboard
#            does not answer on it.

# Admin network -------------------------------------------------------------

# The dashboard and the REST API bind to this address and no other. Leaving it
# unset defaults to SERVER_IP, which puts the admin interface on the deploy
# network -- acceptable in a lab, not otherwise.
ADMIN_IP=

# BMC network ---------------------------------------------------------------

# The interface facing the iLO/iDRAC network. Recorded, not bound to: the
# scanner makes outbound connections and routing picks the interface. Set it so
# the installer can check it exists and so all three are documented here.
BMC_INTERFACE=

# The address range the scanner sweeps is not set here -- it lives in the admin
# UI under Settings > iLO, together with the credentials and the name suffix
# (default "-ilo") that turns orbesx1001-ilo.dc.infra into orbesx1001.

# Deploy network ------------------------------------------------------------

# This server's address on the deploy network. Kea advertises it as next-server
# and it is the base of every URL in the boot chain.
SERVER_IP=

# The interface Kea listens on. DHCP is broadcast, so this one really is bound.
INTERFACE=

# Handed to booting servers. Must not contain SERVER_IP.
DHCP_RANGE=
NETMASK=255.255.255.0
GATEWAY=
DNS=
DOMAIN=local

# Written into the kickstart rather than offered over DHCP.
NTP=

# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
#
# Optional here. Leave them blank and install.sh prompts, which keeps them off
# disk entirely. If you do fill them in, this file must be chmod 600 -- it then
# holds the root password of every host the appliance installs, and install.sh
# warns when it is readable by anyone else.

# The iLO account the scanner authenticates with, estate-wide. Per-host
# overrides are set in the admin UI.
ILO_USER=Administrator
ILO_PASSWORD=

# The root password every ESXi host is installed with.
ESXI_PASSWORD=

# The dashboard password. Generated and printed at the end if left blank.
ADMIN_PASSWORD=
