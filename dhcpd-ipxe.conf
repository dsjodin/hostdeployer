# DHCP Server Configuration for ESXi Auto-deployment
option domain-name "example.com";
option domain-name-servers 192.168.1.10, 192.168.1.11;
default-lease-time 600;
max-lease-time 7200;
authoritative;
log-facility local7;

# Define architecture option
option arch code 93 = unsigned integer 16;

subnet 192.168.1.0 netmask 255.255.255.0 {
  range 192.168.1.100 192.168.1.200;
  option routers 192.168.1.1;
  
  # UEFI HTTP Boot - UEFI x64 (type 0x07) or x64 HTTP (type 0x10)
  if option arch = 7 or option arch = 10 {
    filename "http://192.168.1.5/ipxe/ipxe.efi";
  } else {
    # Legacy BIOS systems
    filename "http://192.168.1.5/ipxe/undionly.kpxe";
  }
}