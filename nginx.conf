# nginx site configuration for the ESXi auto-deployment server.
#
# Layout on disk:
#   /srv/autodeploy/www        PHP endpoints and the admin dashboard
#   /srv/autodeploy/ipxe       ipxe.efi and boot.ipxe
#   /srv/autodeploy/esxi/<ver> extracted ESXi installer media
#   /srv/autodeploy/config     configuration and credentials (NOT served)
#   /srv/autodeploy/logs       log files (NOT served)
#
# No server address appears in this file: hostnames come from the request and
# the deployment server's own URL is configured in global_config.json.

upstream autodeploy_php {
    server unix:/var/run/php/php-fpm.sock;
}

# ---------------------------------------------------------------------------
# Port 80: everything the boot chain needs, plus a redirect for humans.
#
# UEFI HTTP Boot and iPXE (as commonly built) have no usable trust store, so
# the boot artefacts must stay reachable over plain HTTP. The admin interface
# must not.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/autodeploy-access.log;
    error_log  /var/log/nginx/autodeploy-error.log;

    root /srv/autodeploy/www;

    # Uploaded kickstart templates are small; installers do not POST.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # -- Boot artefacts -----------------------------------------------------

    # iPXE binaries and the static chain script.
    location /ipxe/ {
        alias /srv/autodeploy/ipxe/;
        autoindex off;
    }

    # ESXi installer media. The regex capture is bounded to a single path
    # segment for the version and the trailing path is matched by nginx after
    # URI normalisation, so ../ cannot escape the alias.
    location ~ ^/esxi/(?<esxi_version>[A-Za-z0-9._-]+)/(?<esxi_file>.+)$ {
        alias /srv/autodeploy/esxi/$esxi_version/$esxi_file;
        # Directory listing of the installer tree was left on "temporarily for
        # debugging"; it exposes the full image contents to anyone on the
        # provisioning VLAN.
        autoindex off;
    }

    # Dynamic iPXE script generator.
    location = /boot.ipxe.php {
        include        fastcgi_params;
        fastcgi_pass   autodeploy_php;
        fastcgi_param  SCRIPT_FILENAME /srv/autodeploy/www/boot.ipxe.php;
    }

    # Dynamic kickstart generator.
    location = /ks.cfg {
        include        fastcgi_params;
        fastcgi_pass   autodeploy_php;
        fastcgi_param  SCRIPT_FILENAME /srv/autodeploy/www/generate_kickstart.php;
    }

    # Deployment completion callback from %firstboot.
    location = /deployment_complete.php {
        include        fastcgi_params;
        fastcgi_pass   autodeploy_php;
        fastcgi_param  SCRIPT_FILENAME /srv/autodeploy/www/deployment_complete.php;
    }

    # The kickstart templates call the callback under /admin/; keep that URL
    # working without exposing the rest of /admin/ over plain HTTP.
    location = /admin/deployment_complete.php {
        include        fastcgi_params;
        fastcgi_pass   autodeploy_php;
        fastcgi_param  SCRIPT_FILENAME /srv/autodeploy/www/deployment_complete.php;
    }

    # -- Admin interface ----------------------------------------------------

    # Send operators to HTTPS. Session cookies and the login form must never
    # travel in the clear.
    location /admin/ {
        return 301 https://$host$request_uri;
    }

    location = / {
        return 301 https://$host/admin/;
    }

    # Everything else on port 80 is not part of the boot chain.
    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the admin dashboard.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/autodeploy-admin-access.log;
    error_log  /var/log/nginx/autodeploy-admin-error.log;

    # Replace with a certificate for this host. A self-signed certificate is
    # acceptable on an isolated provisioning network; browsers are the only
    # clients here, and they can be told to trust it once.
    ssl_certificate     /etc/ssl/autodeploy/server.crt;
    ssl_certificate_key /etc/ssl/autodeploy/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:autodeploy:10m;
    ssl_session_timeout 10m;

    root /srv/autodeploy/www;
    index admin_dashboard.php;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'" always;

    location = / {
        return 301 /admin/;
    }

    # -- REST API ------------------------------------------------------------
    #
    # Deliberately only on the TLS listener. The API authenticates with a
    # bearer token, and a token crossing port 80 is a token on the wire. Port
    # 80 exists for the boot chain, whose clients are firmware that cannot
    # hold a credential at all.
    # The capture is what puts the route in PATH_INFO without the /api prefix;
    # a prefix location would pass the whole URI and api.php would see "api"
    # where it expects the version segment.
    location ~ ^/api(/.*)$ {
        include        fastcgi_params;
        fastcgi_pass   autodeploy_php;
        fastcgi_param  SCRIPT_FILENAME /srv/autodeploy/www/api.php;
        fastcgi_param  PATH_INFO       $1;

        # fastcgi_params does not forward Authorization, and php-fpm cannot
        # see the header without it, so every request would arrive anonymous.
        fastcgi_param  HTTP_AUTHORIZATION $http_authorization;
    }

    location /admin/ {
        alias /srv/autodeploy/www/;
        index admin_dashboard.php;

        # Never serve backups, editor leftovers or anything but PHP/static
        # assets out of the application directory.
        location ~* \.(bak|php_bak|json|log|sql|swp|orig|dist|inc)$ {
            deny all;
        }

        # Do not hand .py helper scripts to clients as source.
        location ~* \.py$ {
            deny all;
        }

        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   autodeploy_php;
            fastcgi_param  SCRIPT_FILENAME $request_filename;
            # Refuse /foo.jpg/bar.php style path-info attacks.
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param  PATH_INFO $fastcgi_path_info;
        }
    }

    # config/ and logs/ live outside this root, but block the paths anyway in
    # case the root is ever moved.
    location ~ ^/(config|logs|lib|scripts)/ {
        deny all;
    }

    location / {
        return 404;
    }
}
