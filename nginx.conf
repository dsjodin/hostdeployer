server {
    listen 80;
    server_name _;  # Catch all requests
    
    # Access and error logs
    access_log /var/log/nginx/autodeploy-access.log;
    error_log /var/log/nginx/autodeploy-error.log;
    
    # Root directory for HTTP boot files
    root /usr/share/nginx/html;
    
    # Index files
    index index.html index.php;
    
    # PHP file handling
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;  # Debian PHP-FPM socket
        fastcgi_index index.php;
    }
    
    # iPXE bootloader files
    location /ipxe/ {
        alias /srv/autodeploy/ipxe/;
    }
    
    # iPXE script generator
    location = /boot.ipxe.php {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /srv/autodeploy/www/boot.ipxe.php;
        include fastcgi_params;
    }
    
    # Static iPXE boot configuration
    location = /boot.ipxe {
        alias /srv/autodeploy/www/boot.ipxe;
    }
    

location ~* ^/esxi/([^/]+)/(.*)$ {
    alias /srv/autodeploy/esxi/$1/$2;
    autoindex on;  # Temporarily enable for debugging
    add_header X-Debug-Path $request_uri;
    add_header X-Debug-Alias /srv/autodeploy/esxi/$1/$2;
}


    # Admin dashboard
    location /admin/ {
        alias /srv/autodeploy/www/;
        index admin_dashboard.php;
        
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            fastcgi_index index.php;
        }
    }
    
# Dynamic kickstart generation
location /ks.cfg {
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
    fastcgi_index generate_kickstart.php;
    fastcgi_param SCRIPT_FILENAME /srv/autodeploy/www/generate_kickstart.php;
    include fastcgi_params;
    
    # Make sure query parameters are passed through
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param DOCUMENT_URI $document_uri;
}
   
    # Deployment complete callback
    location /deployment-complete.php {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /srv/autodeploy/www/deployment-complete.php;
        include fastcgi_params;
    }
    
    # Log viewer for admin dashboard
    location /get_log.php {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /srv/autodeploy/www/get_log.php;
        include fastcgi_params;
    }
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
